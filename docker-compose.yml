services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: enterprise-ai-ops-postgres
    environment:
      POSTGRES_DB: enterprise_ai_ops
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d enterprise_ai_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
