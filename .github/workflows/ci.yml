name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: enterprise_ai_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app_user -d enterprise_ai_ops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall app

      - name: Initialize database
        env:
          APP_DATABASE_URL: postgresql+psycopg://app_user:app_password@localhost:5432/enterprise_ai_ops
          SQL_READER_DATABASE_URL: postgresql+psycopg://sql_reader:sql_reader_password@localhost:5432/enterprise_ai_ops
        run: python scripts/init_db.py

      - name: Configure read-only SQL role
        env:
          PGPASSWORD: app_password
        run: psql -h localhost -p 5432 -U app_user -d enterprise_ai_ops -f scripts/create_readonly_role.sql

      - name: Test
        env:
          OPENAI_API_KEY: test-key
          OPENAI_MODEL: test-model
          LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://app_user:app_password@localhost:5432/enterprise_ai_ops
          APP_DATABASE_URL: postgresql+psycopg://app_user:app_password@localhost:5432/enterprise_ai_ops
          SQL_READER_DATABASE_URL: postgresql+psycopg://sql_reader:sql_reader_password@localhost:5432/enterprise_ai_ops
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ISSUER: enterprise-ai-ops
          JWT_AUDIENCE: enterprise-ai-ops-api
          JWT_ALGORITHM: HS256
        run: pytest -q
